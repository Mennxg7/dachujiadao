/* ============================================================
 * 小厨神驾到 · 暖色治愈系风格（参考"今天吃什么呀"）
 * ============================================================ */
:root {
  --bg: #f5efe6;            /* 暖米色背景 */
  --bg-soft: #faf6ee;
  --card: #ffffff;
  --primary: #e8a854;       /* 暖橙黄 */
  --primary-d: #d4913a;
  --accent: #f0c78e;        /* 浅金 */
  --text: #3d3327;          /* 深棕 */
  --muted: #9a8f82;
  --line: #ede4d6;
  --warn: #e6a23c;
  --bad: #d9534f;
  --radius: 16px;
  --shadow: 0 2px 12px rgba(139,115,85,.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex; justify-content: center;
  min-height: 100vh;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* ===== 手机外壳 ===== */
.phone {
  width: 100%; max-width: 430px;
  background: var(--bg);
  min-height: 100vh;
  display: flex; flex-direction: column;
  position: relative;
}

/* ===== 顶部栏（非点菜页用） ===== */
.app-header {
  background: linear-gradient(135deg, var(--primary), var(--primary-d));
  color: #fff; padding: 18px 18px 14px;
  position: sticky; top: 0; z-index: 5;
}
.app-header__title { font-size: 20px; font-weight: 700; }
.app-header__sub { font-size: 12px; opacity: .88; margin-top: 2px; }

/* ===== 内容区 ===== */
.screen { flex: 1; padding: 0 0 80px; overflow-y: auto; }

/* ===== 点菜页专用：无顶部栏，直接从横幅开始 ===== */
.page--order .screen-inner { padding-top: 0; }

/* ===== 顶部卡通横幅 ===== */
.hero-banner {
  position: relative; height: 160px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; margin-bottom: 4px;
}
.hero-banner__bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,220,180,.6) 0%, transparent 50%),
    radial-gradient(circle at 80% 60%, rgba(255,200,150,.4) 0%, transparent 45%),
    linear-gradient(180deg, #fff8ed 0%, #f5e6cc 100%);
}
.hero-banner__bg::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    radial-gradient(circle, rgba(232,168,84,.15) 1px, transparent 1px),
    radial-gradient(circle, rgba(240,199,142,.12) 1px, transparent 1px);
  background-size: 24px 24px, 32px 32px;
  background-position: 0 0, 12px 12px;
}
.hero-banner__text {
  position: relative; z-index: 1;
  font-size: 26px; font-weight: 800; color: #6b4c2a;
  letter-spacing: 4px;
  text-shadow: 0 2px 0 rgba(255,255,255,.7), 0 4px 12px rgba(107,76,42,.08);
  padding: 10px 28px;
  background: rgba(255,255,255,.55);
  border-radius: 30px;
  border: 2px solid rgba(255,255,255,.7);
  backdrop-filter: blur(4px);
}

/* ===== 工具栏 ===== */
.toolbar { display: flex; gap: 8px; margin-bottom: 10px; padding: 0 14px; }
.toolbar--order { justify-content: space-between; align-items: center; }
.toolbar .input--search { flex: 1; }

/* 冰箱：顶栏整体下移一点，留出呼吸感 */
.page--fridge { padding-top: 12px; }
/* 冰箱顶部分类筛选条 */
.fridge-filters {
  display: flex; gap: 8px; overflow-x: auto;
  padding: 6px 14px 10px; position: sticky; top: 0; z-index: 4;
  background: var(--bg);
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.fridge-filters::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; padding: 7px 16px; border-radius: 20px;
  background: #fff; color: var(--muted); font-size: 13px; font-weight: 600;
  border: 1px solid var(--line); transition: all .16s ease;
  box-shadow: 0 1px 4px rgba(139,115,85,.06);
}
.chip:active { transform: scale(.95); }
.chip--active {
  background: var(--primary); color: #fff; border-color: var(--primary);
  box-shadow: 0 2px 8px rgba(232,168,84,.35);
}

/* ===== 按钮 ===== */
.btn {
  background: #fff; color: var(--text);
  border: 1px solid var(--line); border-radius: 12px;
  padding: 8px 14px; font-size: 13px; font-weight: 600;
  transition: transform .05s, box-shadow .15s;
  box-shadow: 0 1px 4px rgba(139,115,85,.06);
}
.btn:active { transform: scale(.96); }
.btn--primary { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 2px 8px rgba(232,168,84,.35); }
.btn--ghost { color: var(--muted); border-color: transparent; box-shadow: none; background: transparent; }
.btn--danger-ghost { color: var(--bad); border-color: #f5d5d5; }
.btn--done { background: #eef7ec; color: #4a8c3a; border-color: #d4ebcf; }
.btn--small, .btn--sm { padding: 6px 11px; font-size: 12px; border-radius: 10px; }
.btn--block { width: 100%; margin-top: 14px; padding: 13px; }

/* ===== 列表 / 卡片通用 ===== */
.list { display: flex; flex-direction: column; gap: 10px; padding: 0 14px; }
.card {
  background: var(--card); border-radius: var(--radius);
  padding: 14px; box-shadow: var(--shadow);
}
.card--row { display: flex; align-items: center; gap: 12px; }
.card__main { flex: 1; min-width: 0; }
.card__title { font-weight: 700; font-size: 15px; color: var(--text); }
.card__meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
.card__actions { display: flex; gap: 6px; flex-shrink: 0; }
.card__head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 10px; }
.card .field { margin-bottom: 10px; }

.group-title { font-size: 14px; color: var(--muted); font-weight: 700; margin: 16px 14px 8px; }
.empty { text-align: center; color: var(--muted); padding: 48px 20px; font-size: 14px; line-height: 1.7; }

.avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: #fef3e8; display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}

/* ===== 临期 ===== */
.exp--warn { color: var(--warn); font-weight: 600; }
.exp--bad { color: var(--bad); font-weight: 700; }

/* ============================================================
 *  点菜页核心样式（参考图风格）
 * ============================================================ */

/* 左侧分类栏 */
.order-layout { display: flex; gap: 6px; align-items: flex-start; padding: 0 10px; }
.order-filters {
  width: 64px; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 6px;
  position: sticky; top: 0; padding-top: 4px;
  z-index: 3;
}
.ofilter {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 10px 4px 8px;
  background: transparent; border-radius: 14px;
  border: none; color: var(--muted);
  transition: all .18s ease;
}
.ofilter .ofilter__icon { font-size: 26px; line-height: 1; }
.ofilter .ofilter__label { font-size: 11px; font-weight: 500; line-height: 1.2; }
.ofilter:hover { background: rgba(232,168,84,.08); }
.ofilter--active {
  background: #fff;
  box-shadow: 0 2px 10px rgba(139,115,85,.12);
  color: var(--primary-d);
  transform: scale(1.04);
}
.ofilter--active .ofilter__label { font-weight: 700; color: var(--primary-d); }

/* 右侧目录区 */
.order-catalog { flex: 1; min-width: 0; padding: 0 4px 20px; }

/* 分类标题 */
.cat-header {
  display: flex; align-items: center; gap: 6px;
  padding: 14px 4px 8px; font-size: 17px; font-weight: 800; color: var(--text);
}
.cat-header .cat-header__icon { font-size: 20px; }

/* 双列大卡片网格 */
.dish-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.dish-card {
  background: var(--card); border-radius: var(--radius);
  overflow: hidden; box-shadow: var(--shadow);
  position: relative;
  transition: transform .15s;
}
.dish-card:active { transform: scale(.97); }

.dish-card__img {
  width: 100%; aspect-ratio: 1 / .75;
  object-fit: cover; display: block;
  background: linear-gradient(145deg, #fdf3e6, #f5e0c4);
}
.dish-card__img--ph {
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; color: var(--accent);
}

.dish-card__body { padding: 10px 12px 36px; } /* 底部留空间给加购按钮 */
.dish-card__name {
  font-size: 14px; font-weight: 700; color: var(--text);
  line-height: 1.3; margin-bottom: 4px;
}
.dish-card__ings {
  font-size: 11px; color: var(--muted);
  line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}

/* 圆形加购按钮 */
.dish-card__add {
  position: absolute; bottom: 10px; right: 10px;
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--primary); color: #fff;
  font-size: 20px; font-weight: 300;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(232,168,84,.4);
  border: none; cursor: pointer;
  transition: transform .15s;
}
.dish-card__add:active { transform: scale(.88); }

/* ============================================================
 *  菜谱页（保持双列网格）
 * ============================================================ */
.recipe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 14px; }
.recipe-card { background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.recipe-card__cover { height: 120px; background-size: cover; background-position: center; background-color: #fdf3e6; display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--accent); font-weight: 700; }
.recipe-card__cover--ph { background: linear-gradient(145deg, #fdf3e6, #f5e0c4); }
.recipe-card__body { padding: 10px 12px; }
.recipe-card__name { font-weight: 700; font-size: 14px; }
.recipe-card__meta { font-size: 11px; color: var(--muted); margin: 4px 0 6px; }
.recipe-card__acts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }

.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 10px; background: #fef3e8; color: var(--primary-d); padding: 2px 8px; border-radius: 8px; font-weight: 500; }

/* ===== 表单 ===== */
.field { display: flex; flex-direction: column; gap: 5px; }
.form-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 600; }

/* 多选框组（存放位置：冷冻 / 冷藏） */
.checks { display: flex; gap: 18px; flex-wrap: wrap; padding: 4px 2px; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--primary); }
.input {
  border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 13px; font-size: 14px; width: 100%;
  background: var(--bg-soft); color: var(--text);
  transition: border-color .15s, box-shadow .15s;
}
.input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(232,168,84,.12); }
.input--search { flex: 1; }
.form-row { display: flex; gap: 10px; }
.form-row .field { flex: 1; }

.dyn { display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; }
.dyn-row { display: flex; gap: 6px; align-items: center; }
.dyn-row input { flex: 1; }
.dyn-row--col { flex-direction: column; align-items: stretch; }
.dyn-row .btn { flex-shrink: 0; }

.sub-title { font-weight: 700; font-size: 14px; margin: 14px 0 8px; display: flex; align-items: center; gap: 8px; }
.hint { font-size: 13px; color: var(--muted); }
.detail-cover { width: 100%; border-radius: 14px; margin-bottom: 10px; }
.step-img { width: 100%; border-radius: 10px; margin-top: 6px; }
.steps { padding-left: 20px; line-height: 1.7; font-size: 14px; }
.shop-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.shop-list li { display: flex; justify-content: space-between; background: var(--bg-soft); padding: 10px 14px; border-radius: 12px; font-size: 14px; }
.shop-list li b { color: var(--primary-d); }

.cover-preview img { max-width: 100%; border-radius: 12px; margin-top: 8px; }

/* ===== 底部导航 ===== */
.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px;
  background: #fff; border-top: 1px solid var(--line);
  display: flex; padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
  z-index: 6; box-shadow: 0 -2px 12px rgba(139,115,85,.06);
}
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); padding: 5px 0; transition: color .15s; }
.tab__icon { font-size: 22px; }
.tab__label { font-size: 10px; font-weight: 500; }
.tab--active { color: var(--primary-d); }

/* ===== 弹窗（居中悬浮窗口） ===== */
.modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 22px; }
.modal[hidden] { display: none; }
.modal__mask { position: absolute; inset: 0; background: rgba(58,46,30,.38); }
.modal__panel {
  position: relative; background: #fff; width: 100%; max-width: 400px;
  max-height: 82vh; overflow-y: auto; border-radius: 22px;
  padding: 20px; animation: pop .22s ease;
  box-shadow: 0 12px 44px rgba(58,46,30,.28);
}
@keyframes pop { from { transform: scale(.92); opacity: .35; } }
.modal__head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 17px; margin-bottom: 14px; }
.modal__close { font-size: 20px; color: var(--muted); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.modal__close:active { background: var(--bg-soft); }

/* ===== 水彩占位图 ===== */
.wc-svg { width: 100%; height: 100%; display: block; border-radius: inherit; }
.dish-card__img--ph, .menu-row__img, .diary-dish-item__img { padding: 0; background: #fdf6ec; }

/* ===== Toast ===== */
.toast {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
  background: rgba(58,46,30,.82); color: #fff; padding: 13px 24px; border-radius: 14px;
  font-size: 14px; z-index: 30; backdrop-filter: blur(8px);
}
.toast[hidden] { display: none; }

/* ===== 手机适配 ===== */
@media (max-width: 380px) {
  .recipe-grid { grid-template-columns: 1fr; }
  .dish-grid { grid-template-columns: 1fr; }
  .hero-banner { height: 130px; }
  .hero-banner__text { font-size: 22px; letter-spacing: 2px; padding: 8px 20px; }
  .ofilters { width: 56px; }
  .ofilter .ofilter__icon { font-size: 22px; }
}

/* ============================================================
 *  今日菜单底部面板（Sheet）
 * ============================================================ */
.sheet {
  position: fixed; inset: 0; z-index: 25;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet[hidden] { display: none; }
.sheet__mask {
  position: absolute; inset: 0;
  background: rgba(58,46,30,.35);
}
.sheet__panel {
  position: relative; background: #fff;
  width: 100%; max-width: 430px;
  max-height: 80vh;
  border-radius: 24px 24px 0 0;
  display: flex; flex-direction: column;
  box-shadow: 0 -6px 30px rgba(58,46,30,.18);
  animation: sheetUp .28s ease;
}
@keyframes sheetUp { from { transform: translateY(100%); } }

.sheet__head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 20px 4px;
  flex-shrink: 0;
}
.sheet__title { font-size: 19px; font-weight: 800; color: var(--text); }
.sheet__close {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--bg-soft); color: var(--muted);
  font-size: 16px; display: flex; align-items: center; justify-content: center;
}
.sheet__body {
  flex: 1; overflow-y: auto;
  padding: 8px 16px 12px;
}
.sheet__foot {
  display: flex; gap: 10px; padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
  flex-shrink: 0; border-top: 1px solid var(--line);
}
.sheet__foot .btn { flex: 1; text-align: center; padding: 13px; font-size: 15px; }

/* 菜单项行（今日菜单内） */
.menu-row {
  display: flex; align-items: center; gap: 10px;
  background: #fff; border-radius: 14px;
  padding: 10px 12px; margin-bottom: 8px;
  box-shadow: 0 1px 6px rgba(139,115,85,.06);
  border: 1px solid var(--line);
}
.menu-row__img {
  width: 44px; height: 44px; border-radius: 10px;
  object-fit: cover; flex-shrink: 0;
  background: linear-gradient(145deg, #fdf3e6, #f5e0c4);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; color: var(--accent);
}
.menu-row__name { flex: 1; font-weight: 700; font-size: 14px; min-width: 0; }

/* 数量控制器 */
.qty {
  display: flex; align-items: center; gap: 2px;
  background: var(--primary); border-radius: 20px;
  padding: 2px; flex-shrink: 0;
}
.qty__btn {
  width: 30px; height: 30px; border-radius: 50%;
  background: transparent; color: #fff;
  font-size: 18px; font-weight: 300;
  display: flex; align-items: center; justify-content: center;
  line-height: 1; cursor: pointer;
}
.qty__btn:active { opacity: .7; }
.qty__num {
  width: 28px; text-align: center;
  font-size: 14px; font-weight: 700; color: #fff;
  line-height: 28px;
}

/* 分组标题（菜单内） */
.menu-group-title {
  display: flex; align-items: center; gap: 6px;
  font-size: 14px; font-weight: 700; color: var(--muted);
  margin: 14px 0 6px;
}
.menu-group-title .menu-group-icon { font-size: 17px; }

/* 空菜单 */
.menu-empty {
  text-align: center; color: var(--muted); padding: 40px 16px;
  font-size: 14px; line-height: 1.7;
}

/* ============================================================
 *  食记页
 * ============================================================ */
.diary-hero {
  padding: 28px 18px 16px;
  background:
    radial-gradient(circle at 25% 40%, rgba(255,220,180,.45) 0%, transparent 50%),
    linear-gradient(180deg, #fff8ed 0%, var(--bg) 100%);
}
.diary-hero__motto {
  font-size: 13px; color: var(--muted); margin-bottom: 4px;
}
.diary-hero__title {
  font-size: 24px; font-weight: 800; color: var(--text);
}

/* 食记日期卡片 */
.diary-card {
  background: var(--card); border-radius: var(--radius);
  margin: 0 14px 14px; padding: 18px;
  box-shadow: var(--shadow);
}
.diary-card__head {
  display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
}
.diary-date-badge {
  width: 48px; height: 48px; border-radius: 14px;
  background: var(--primary); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.diary-date-badge__day { font-size: 20px; font-weight: 800; line-height: 1; }
.diary-date-badge__weekday { font-size: 10px; opacity: .85; margin-top: 1px; }
.diary-date-info { flex: 1; }
.diary-date-info__label { font-size: 16px; font-weight: 700; }
.diary-date-info__sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.diary-date-del {
  font-size: 13px; color: var(--bad); cursor: pointer;
  padding: 4px 8px; border-radius: 8px;
}
.diary-date-del:active { background: #fef0f0; }

/* 食记内的菜品列表 */
.diary-dish-list { display: flex; flex-direction: column; gap: 6px; }
.diary-dish-group { margin-bottom: 8px; }
.diary-dish-group__label {
  font-size: 13px; color: var(--muted); font-weight: 600;
  margin-bottom: 6px;
}
.diary-dish-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 10px;
}
.diary-dish-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.diary-dish-item__img {
  width: 72px; height: 54px; border-radius: 10px;
  object-fit: cover; background: linear-gradient(145deg, #fdf3e6, #f5e0c4);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; color: var(--accent);
}
.diary-dish-item__name {
  font-size: 11px; font-weight: 600; color: var(--text);
  text-align: center; line-height: 1.2;
}

/* ============================================================
 *  我的页（统一背景，按名称平铺排列）
 * ============================================================ */
.mine-body { padding: 8px 16px 24px; }

.mine-block { margin-top: 20px; }

.mine-block__title {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 13px; font-weight: 700; color: var(--muted);
  margin-bottom: 6px; padding-left: 2px;
}
.mine-block__title .btn { padding: 5px 10px; font-size: 12px; }

/* 家庭名称输入行 */
.mine-field { display: flex; gap: 8px; align-items: center; }
.mine-field .input { flex: 1; }

/* 平铺行（去白卡，统一背景 + 分隔线） */
.mine-row {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 2px;
  border-bottom: 1px solid var(--line);
}
.mine-row:last-child { border-bottom: none; }
.mine-row--link { cursor: pointer; }
.mine-row--link:active { opacity: .7; }
.mine-row__icon { font-size: 22px; width: 30px; text-align: center; flex-shrink: 0; }
.mine-row__main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mine-row__name { font-weight: 700; font-size: 15px; color: var(--text); }
.mine-row__sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

.arrow {
  margin-left: auto; font-size: 22px; color: var(--muted); font-weight: 300; flex-shrink: 0;
}

.mine-empty-row { font-size: 13px; color: var(--muted); padding: 12px 2px; }

/* 食记：只显示菜名（不显示图片） */
.diary-names { font-size: 14px; line-height: 1.7; color: var(--text); }
/* 食记并入"我的"后，去掉卡片左右外边距，避免与页面内边距叠加 */
#diaryList .diary-card { margin: 0 0 12px; }

.mine-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.mine-actions .btn { flex: 1; min-width: 120px; }

</style>
</head>
<body>
  <div class="phone">
    <!-- 顶部栏 -->
    <header class="app-header">
      <div class="app-header__title" id="headerTitle">小厨神驾到</div>
      <div class="app-header__sub" id="headerSub">家庭：—</div>
    </header>

    <!-- 主内容区 -->
    <main class="screen" id="screen">
      <!-- ===== 点菜（参考图风格） ===== -->
      <section class="page page--order" data-page="order">
        <div class="hero-banner">
          <div class="hero-banner__bg"></div>
          <div class="hero-banner__text">今天吃什么呀</div>
        </div>

        <div class="toolbar toolbar--order">
          <button class="btn btn--ghost btn--sm" id="btnShopping">🛒 采购清单(<span id="cartCount">0</span>)</button>
          <button class="btn btn--primary btn--sm" id="btnTodayMenu">今日菜单</button>
        </div>

        <div class="order-layout">
          <aside class="order-filters" id="orderFilters"></aside>
          <div class="order-catalog" id="orderCatalog"></div>
        </div>
      </section>

      <!-- ===== 冰箱 ===== -->
      <section class="page page--fridge" data-page="fridge" hidden>
        <div class="fridge-filters" id="fridgeFilters"></div>
        <div class="toolbar">
          <input class="input input--search" id="fridgeSearch" placeholder="搜索食材…" />
          <button class="btn btn--primary" id="btnAddIngredient">＋ 新增</button>
        </div>
        <div id="fridgeList" class="list"></div>
      </section>

      <!-- ===== 我的（统一背景，按名称排列） ===== -->
      <section class="page" data-page="mine" hidden>
        <div class="mine-body">
          <!-- 我的家庭 -->
          <div class="mine-block">
            <div class="mine-block__title">我的家庭</div>
            <div class="mine-field">
              <input class="input" id="familyName" placeholder="例如：幸福一家" />
              <button class="btn btn--primary btn--sm" id="btnSaveFamily">保存</button>
            </div>
          </div>

          <!-- 食记（并入我的） -->
          <div class="mine-block">
            <div class="mine-block__title">食记</div>
            <div id="diaryList"></div>
          </div>

          <!-- 厨房 -->
          <div class="mine-block">
            <div class="mine-block__title">厨房</div>
            <div class="mine-row mine-row--link" data-goto="kitchen">
              <span class="mine-row__icon">🍳</span>
              <span class="mine-row__main">
                <span class="mine-row__name">所有菜谱管理</span>
                <span class="mine-row__sub">新增 / 编辑 / 删除菜谱</span>
              </span>
              <span class="arrow">›</span>
            </div>
          </div>

          <!-- 家庭成员 -->
          <div class="mine-block">
            <div class="mine-block__title">家庭成员 <button class="btn btn--sm btn--ghost" id="btnAddMember">＋ 添加</button></div>
            <div id="memberList"></div>
          </div>

          <!-- 数据与示例 -->
          <div class="mine-block">
            <div class="mine-block__title">数据与示例</div>
            <div class="mine-actions">
              <button class="btn btn--ghost btn--sm" id="btnSeed">载入示例数据</button>
              <button class="btn btn--danger-ghost btn--sm" id="btnReset">清空所有数据</button>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== 厨房（菜谱管理，从我的进入） ===== -->
      <section class="page" data-page="kitchen" hidden>
        <div class="toolbar">
          <button class="btn btn--ghost btn--sm" id="btnBackFromKitchen">‹ 返回</button>
          <input class="input input--search" id="recipeSearch" placeholder="搜索菜谱…" style="flex:1" />
          <button class="btn btn--primary btn--sm" id="btnAddRecipe">＋ 新增</button>
        </div>
        <div id="recipeList" class="recipe-grid"></div>
      </section>
    </main>

    <!-- 底部导航 -->
    <nav class="tabbar">
      <button class="tab" data-tab="order"><span class="tab__icon">🍽️</span><span class="tab__label">点菜</span></button>
      <button class="tab" data-tab="fridge"><span class="tab__icon">🧊</span><span class="tab__label">冰箱</span></button>
            <button class="tab" data-tab="mine"><span class="tab__icon">👤</span><span class="tab__label">我的</span></button>
    </nav>
  </div>

  <!-- 通用弹窗 -->
  <div class="modal" id="modal" hidden>
    <div class="modal__mask" data-close></div>
    <div class="modal__panel">
      <div class="modal__head">
        <span id="modalTitle">标题</span>
        <button class="modal__close" data-close>✕</button>
      </div>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <!-- 今日菜单弹窗（底部大面板） -->
  <div class="sheet" id="todaySheet" hidden>
    <div class="sheet__mask" id="sheetMask"></div>
    <div class="sheet__panel">
      <div class="sheet__head">
        <span class="sheet__title">今日菜单</span>
        <button class="sheet__close" id="sheetClose">✕</button>
      </div>
      <div class="sheet__body" id="sheetBody"></div>
      <div class="sheet__foot">
        <button class="btn btn--primary btn--block" id="btnPlaceOrder">去下单</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

          ]
        },
        {
          id: 'r17', name: '凉拌黄瓜', cover: '', tags: ['素菜', '减脂'],
          ingredients: [
            { name: '黄瓜', amount: 2, unit: '根' },
            { name: '蒜', amount: 1, unit: '头' },
            { name: '盐', amount: 1, unit: '撮' }
          ],
          steps: [

        { id: 'o1', recipeId: 'r1', name: '西红柿炒蛋', orderedBy: 'm2', status: '想吃', date: today(), count: 1 },
        { id: 'o2', recipeId: 'r2', name: '肉末烧茄子', orderedBy: 'm1', status: '想吃', date: today(), count: 1 }
      ],
      diary: []
    };
    // 为菜谱分配封面（循环使用内嵌图片）
    s.recipes.forEach(function (r, i) {
      if (__IMG.length) r.cover = __IMG[i % __IMG.length];
    });
    return s;
  }

  function today() { return new Date().toISOString().slice(0, 10); }
  function addDays(n) {
    var d = new Date(); d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function uid(p) { return (p || 'id') + '_' + Math.random().toString(36).slice(2, 9); }

  // 读取 / 写入（localStorage 不可用时降级为内存模式，避免白屏）
  var memory = null;
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* file:// 或无痕模式下降级 */ }
    memory = seed();
    return memory;
  }
  function save(data) {
    try { localStorage.setItem(KEY, JSON.stringify(data)); }
    catch (e) { memory = data; /* 内存模式，不持久化 */ }
  }

  var data = load();

  var Store = {
    get: function () { return data; },
    persist: function () { save(data); },
    reset: function () { data = seed(); save(data); },
    reseed: function () { data = seed(); save(data); },

    // --- 家庭成员 ---
    addMember: function (m) { data.members.push(Object.assign({ id: uid('m'), role: '成员', avatar: '🙂' }, m)); },
    removeMember: function (id) { data.members = data.members.filter(function (m) { return m.id !== id; }); },

    // --- 冰箱 ---
    addIngredient: function (it) { data.ingredients.push(Object.assign({ id: uid('i') }, it)); },
    updateIngredient: function (id, patch) {
      data.ingredients = data.ingredients.map(function (it) { return it.id === id ? Object.assign({}, it, patch) : it; });
    },
    removeIngredient: function (id) { data.ingredients = data.ingredients.filter(function (it) { return it.id !== id; }); },

    // --- 菜谱 ---
    addRecipe: function (r) { data.recipes.push(Object.assign({ id: uid('r'), ingredients: [], steps: [], tags: [] }, r)); },
    updateRecipe: function (id, patch) {
      data.recipes = data.recipes.map(function (r) { return r.id === id ? Object.assign({}, r, patch) : r; });
    },
    removeRecipe: function (id) {
      data.recipes = data.recipes.filter(function (r) { return r.id !== id; });
      data.menu = data.menu.filter(function (o) { return o.recipeId !== id; });
    },

    // --- 点菜 ---
    addMenuItem: function (o) { data.menu.push(Object.assign({ id: uid('o'), status: '想吃', date: today(), count: 1 }, o)); },
    updateMenuItem: function (id, patch) {
      data.menu = data.menu.map(function (o) { return o.id === id ? Object.assign({}, o, patch) : o; });
    },
    removeMenuItem: function (id) { data.menu = data.menu.filter(function (o) { return o.id !== id; }); },

    // --- 食记 ---
    addDiary: function (entry) { data.diary.push(Object.assign({ id: uid('d') }, entry)); data.diary.sort(function (a,b) { return b.date.localeCompare(a.date); }); },
    removeDiary: function (id) { data.diary = data.diary.filter(function (d) { return d.id !== id; }); },

    // 工具
    today: today,
    uid: uid,
    addDays: addDays
  };

  global.Store = Store;
})(window);

</script>
  <script>
/* ===========================================================
 * 小厨神驾到 · 主逻辑（UI 渲染 + 交互）
 * =========================================================== */
(function () {
  'use strict';

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  var el = function (tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var CATEGORIES = ['肉类', '蔬菜', '水果', '蛋奶', '其他'];

  /* 点菜页左侧分类定义 */
  var ORDER_CATS = [
    { icon: '🔍', label: '全部', value: '全部' },
    { icon: '🍜', label: '饭面', value: '饭面' },
    { icon: '🥩', label: '肉类', value: '荤菜' },
    { icon: '🥬', label: '菜菜', value: '素菜' },
    { icon: '🍓', label: '水果', value: '减脂' },
    { icon: '🍲', label: '汤类', value: '汤类' }
  ];

  /* 分类 → emoji 映射（用于菜单/食记分组标题） */
  var CAT_ICON_MAP = { '荤菜':'🥩', '素菜':'🥬', '减脂':'🥗', '汤类':'🍲', '饭面':'🍜', '早餐':'🍳', '主食':'🍚', '水果':'🍓', '甜甜':'🍰', '家常菜':'🏠' };

  /* 取菜谱主分类（用于配色/水彩占位） */
  function primaryCat(r) { return (r && r.tags && r.tags[0]) || '其他'; }

  /* 水彩风格手绘美食占位图（按分类着色，柔和晕染感） */
  var WATERCOLOR_MAP = {
    '荤菜': '#d98b5a', '素菜': '#8bbf6a', '饭面': '#e8c46a',
    '汤类': '#e0a06a', '减脂': '#e88a8a', '水果': '#e88a8a', '其他': '#cbb08a'
  };
  function watercolorCover(cat) {
    var c = WATERCOLOR_MAP[cat] || WATERCOLOR_MAP['其他'];
    return '<svg class="wc-svg" viewBox="0 0 100 75" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">' +
      '<rect width="100" height="75" fill="#fdf6ec"/>' +
      '<ellipse cx="50" cy="44" rx="30" ry="20" fill="' + c + '" opacity="0.22"/>' +
      '<ellipse cx="45" cy="40" rx="20" ry="14" fill="' + c + '" opacity="0.32"/>' +
      '<ellipse cx="55" cy="46" rx="15" ry="10" fill="' + c + '" opacity="0.28"/>' +
      '<ellipse cx="50" cy="53" rx="36" ry="13" fill="#ffffff"/>' +
      '<ellipse cx="50" cy="53" rx="36" ry="13" fill="none" stroke="#e8dcc8" stroke-width="1.5"/>' +
      '<path d="M42 30 q5 -7 0 -14" stroke="#c9b8a0" stroke-width="1.4" fill="none" opacity="0.5"/>' +
      '<path d="M58 30 q5 -7 0 -14" stroke="#c9b8a0" stroke-width="1.4" fill="none" opacity="0.5"/>' +
    '</svg>';
  }

  /* 当前页面 */
  var currentTab = 'order';

  /* ---------------- 导航 ---------------- */
  function switchTab(tab) {
    // 隐藏所有 page
    $$('.page').forEach(function (p) { p.hidden = true; });
    // 显示目标 page
    var target = $('[data-page="' + tab + '"]');
    if (target) target.hidden = false;

    // tab 高亮
    $$('.tab').forEach(function (b) { b.classList.toggle('tab--active', b.dataset.tab === tab); });

    // header
    $('#headerTitle').textContent = '小厨神驾到';
    $('#headerSub').textContent = '家庭：' + (Store.get().family.name || '未命名');

    currentTab = tab;

    if (tab === 'order') renderOrder();
    if (tab === 'fridge') renderFridge();
    if (tab === 'mine') { renderMine(); renderDiary(); }
    if (tab === 'kitchen') renderKitchen();
  }

  /* 进入子页面（厨房等） */
  function goToSubPage(page) {
    $$('.page').forEach(function (p) { p.hidden = true; });
    var target = $('[data-page="' + page + '"]');
    if (target) target.hidden = false;
    $$('.tab').forEach(function (b) { b.classList.remove('tab--active'); });
    if (page === 'kitchen') renderKitchen();
  }

  /* ---------------- 弹窗 ---------------- */
  function openModal(title, bodyNode) {
    $('#modalTitle').textContent = title;
    var body = $('#modalBody'); body.innerHTML = ''; body.appendChild(bodyNode);
    $('#modal').hidden = false;
  }
  function closeModal() { $('#modal').hidden = true; $('#modalBody').innerHTML = ''; }

  /* ---------------- 今日菜单 Sheet ---------------- */
  function openTodaySheet() {
    renderTodaySheet();
    $('#todaySheet').hidden = false;
  }
  function closeTodaySheet() { $('#todaySheet').hidden = true; }

  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(t._t); t._t = setTimeout(function () { t.hidden = true; }, 1600);
  }

  /* ---------------- 通用表单 ---------------- */
  function field(label, inputNode) {
    var wrap = el('div', 'form-field');
    var l = el('label'); l.textContent = label;
    wrap.appendChild(l); wrap.appendChild(inputNode);
    return wrap;
  }
  function input(attrs) {
    var i = el('input', 'input');
    Object.keys(attrs || {}).forEach(function (k) { i[k] = attrs[k]; });
    return i;
  }
  function select(options, value) {
    var s = el('select', 'input');
    options.forEach(function (o) {
      var op = el('option'); op.value = o; op.textContent = o;
      if (o === value) op.selected = true; s.appendChild(op);
    });
    return s;
  }

  function updateCart() {
    var c = $('#cartCount'); if (c) c.textContent = Store.get().menu.length;
  }

  /* =========================================================
   *  1. 点菜页
   * ========================================================= */
  var orderCat = '全部';

  function buildOrderFilters() {
    var aside = $('#orderFilters'); aside.innerHTML = '';
    ORDER_CATS.forEach(function (c) {
      var btn = el('button', 'ofilter' + (c.value === orderCat ? ' ofilter--active' : ''), '');
      btn.dataset.cat = c.value;
      btn.innerHTML = '<span class="ofilter__icon">' + c.icon + '</span><span class="ofilter__label">' + c.label + '</span>';
      aside.appendChild(btn);
    });
  }

  function renderOrder() {
    var d = Store.get();
    updateCart();
    if (!$('#orderFilters').children.length) buildOrderFilters();

    var cat = $('#orderCatalog'); cat.innerHTML = '';
    var list = d.recipes.filter(function (r) {
      if (orderCat === '全部') return true;
      return (r.tags || []).indexOf(orderCat) >= 0;
    });
    if (!list.length) {
      cat.appendChild(el('div', 'empty', '该分类下还没有菜谱～\n点"我的"→"厨房"去添加吧'));
      return;
    }

    var groups = {};
    list.forEach(function (r) {
      var tag = (r.tags || [])[0] || '其他';
      (groups[tag] = groups[tag] || []).push(r);
    });

    Object.keys(groups).forEach(function (tag) {
      var header = el('div', 'cat-header');
      header.innerHTML = '<span class="cat-header__icon">' + (CAT_ICON_MAP[tag] || '🍽️') + '</span>' + esc(tag);
      cat.appendChild(header);

      var grid = el('div', 'dish-grid');
      groups[tag].forEach(function (r) {
        var card = el('div', 'dish-card');

        if (r.cover) {
          var img = el('img', 'dish-card__img'); img.src = r.cover; img.alt = r.name;
          card.appendChild(img);
        } else {
          var ph = el('div', 'dish-card__img dish-card__img--ph');
          ph.innerHTML = watercolorCover(primaryCat(r));
          card.appendChild(ph);
        }

        var body = el('div', 'dish-card__body');
        body.innerHTML =
          '<div class="dish-card__name">' + esc(r.name) + '</div>' +
          '<div class="dish-card__ings">' + esc(ingSummary(r.ingredients)) + '</div>';
        card.appendChild(body);

        var addBtn = el('button', 'dish-card__add', '+');
        addBtn.dataset.act = 'catalog-add';
        addBtn.dataset.id = r.id;
        card.appendChild(addBtn);

        var viewArea = el('div', '');
        viewArea.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:36px;cursor:pointer;';
        viewArea.dataset.act = 'catalog-view';
        viewArea.dataset.id = r.id;
        card.style.position = 'relative';
        card.insertBefore(viewArea, body);

        grid.appendChild(card);
      });
      cat.appendChild(grid);
    });
  }

  function ingSummary(ings) {
    if (!ings || !ings.length) return '暂无食材';
    return ings.slice(0, 3).map(function (i) { return i.name + (i.amount ? i.amount + (i.unit || '') : ''); }).join(' · ') + (ings.length > 3 ? ' …' : '');
  }

  /** 加购：加入今日菜单（如果已存在则 count+1） */
  function addToOrder(rid) {
    var d = Store.get();
    var r = d.recipes.find(function (x) { return x.id === rid; }); if (!r) return;

    // 检查是否已在菜单中
    var existing = d.menu.find(function (o) { return o.recipeId === rid && o.date === Store.today(); });
    if (existing) {
      existing.count = (existing.count || 1) + 1;
      Store.persist(); updateCart();
      toast('＋1 ' + r.name);
    } else {
      Store.addMenuItem({ recipeId: r.id, name: r.name, orderedBy: (d.members[0] || {}).id || '', count: 1 });
      Store.persist(); updateCart();
      toast('已加购：' + r.name);
    }
  }

  /** 从菜单中移除一道菜（count 减到 0 则删除） */
  function removeFromOrder(mid) {
    var d = Store.get();
    var item = d.menu.find(function (o) { return o.id === mid; });
    if (!item) return;
    if ((item.count || 1) <= 1) {
      Store.removeMenuItem(mid);
    } else {
      item.count--;
      Store.updateMenuItem(mid, { count: item.count });
    }
    Store.persist(); updateCart();
    renderTodaySheet();
  }

  /** 渲染今日菜单面板内容 */
  function renderTodaySheet() {
    var d = Store.get();
    var body = $('#sheetBody'); body.innerHTML = '';

    var todayItems = d.menu.filter(function (o) { return o.date === Store.today(); });

    if (!todayItems.length) {
      body.appendChild(el('div', 'menu-empty', '今天还没有点菜～\n去点菜页挑选吧 🍽️'));
      return;
    }

    // 按菜谱标签分组
    var groups = {};
    todayItems.forEach(function (o) {
      var r = d.recipes.find(function (x) { return x.id === o.recipeId; });
      var tag = (r && r.tags && r.tags[0]) || '其他';
      (groups[tag] = groups[tag] || []).push(o);
    });

    Object.keys(groups).forEach(function (tag) {
      // 分组标题
      var gtitle = el('div', 'menu-group-title');
      gtitle.innerHTML = '<span class="menu-group-icon">' + (CAT_ICON_MAP[tag] || '🍽️') + '</span>' + esc(tag);
      body.appendChild(gtitle);

      // 每道菜的行
      groups[tag].forEach(function (o) {
        var r = d.recipes.find(function (x) { return x.id === o.recipeId; });
        var row = el('div', 'menu-row');

        // 封面图
        if (r && r.cover) {
          var img = el('img', 'menu-row__img'); img.src = r.cover;
          row.appendChild(img);
        } else {
          var ph = el('div', 'menu-row__img'); ph.innerHTML = watercolorCover(primaryCat(r));
          row.appendChild(ph);
        }

        // 菜名
        row.appendChild(el('div', 'menu-row__name', esc(o.name)));

        // 数量控制器
        var qty = el('div', 'qty');
        var cnt = o.count || 1;

        var minus = el('button', 'qty__btn', '−');
        minus.onclick = function (e) { e.stopPropagation(); removeFromOrder(o.id); };

        var num = el('span', 'qty__num', String(cnt));

        var plus = el('button', 'qty__btn', '+');
        plus.onclick = function (e) { e.stopPropagation(); addToOrder(o.recipeId); };

        qty.appendChild(minus); qty.appendChild(num); qty.appendChild(plus);
        row.appendChild(qty);

        body.appendChild(row);
      });
    });
  }

  /** 保存当前菜单为食记 */
  function saveToDiary() {
    var d = Store.get();
    var todayItems = d.menu.filter(function (o) { return o.date === Store.today(); });
    if (!todayItems.length) { toast('还没有点菜，无法保存'); return; }

    var dishes = todayItems.map(function (o) {
      var r = d.recipes.find(function (x) { return x.id === o.recipeId; });
      return {
        recipeId: o.recipeId,
        name: o.name,
        cover: r ? r.cover : '',
        tags: r ? (r.tags || []) : [],
        count: o.count || 1
      };
    });

    Store.addDiary({
      date: Store.today(),
      dishes: dishes,
      createdAt: new Date().toISOString()
    });

    // 清空今日菜单
    todayItems.forEach(function (o) { Store.removeMenuItem(o.id); });
    Store.persist(); updateCart();

    closeTodaySheet();
    toast('已下单，已存入食记 ✨');
    if (currentTab === 'mine') renderDiary();
  }

  /** 采购清单（保留功能） */
  function generateShoppingList() {
    var d = Store.get();
    var need = {};
    d.menu.filter(function (o) { return o.status !== '已做'; }).forEach(function (o) {
      if (!o.recipeId) return;
      var r = d.recipes.find(function (x) { return x.id === o.recipeId; });
      if (!r) return;
      var times = o.count || 1;
      r.ingredients.forEach(function (ing) {
        var key = ing.name + '|' + ing.unit;
        need[key] = (need[key] || 0) + (Number(ing.amount) || 0) * times;
      });
    });
    var missing = [];
    Object.keys(need).forEach(function (key) {
      var p = key.split('|'); var name = p[0], unit = p[1];
      var stock = d.ingredients.filter(function (i) { return i.name === name && i.unit === unit; })
        .reduce(function (s, i) { return s + (Number(i.count) || 0); }, 0);
      var lack = need[key] - stock;
      if (lack > 0) missing.push({ name: name, amount: lack, unit: unit });
    });

    var box = el('div');
    box.appendChild(el('div', 'sub-title', '🛒 还需采购'));
    if (!missing.length) {
      box.appendChild(el('div', 'empty', '🎉 冰箱里的食材足够做这些菜！'));
    } else {
      var sl = el('ul', 'shop-list');
      missing.forEach(function (m) {
        var li = el('li'); li.innerHTML = '<span>' + esc(m.name) + '</span><b>还需 ' + m.amount + ' ' + esc(m.unit) + '</b>';
        sl.appendChild(li);
      });
      box.appendChild(sl);
    }
    openModal('采购清单', box);
  }

  /* =========================================================
   *  2. 冰箱
   * ========================================================= */
  var fridgeCat = '全部';

  function buildFridgeFilters() {
    var bar = $('#fridgeFilters'); if (!bar) return;
    bar.innerHTML = '';
    ['全部'].concat(CATEGORIES).forEach(function (c) {
      var chip = el('button', 'chip' + (c === fridgeCat ? ' chip--active' : ''), c);
      chip.dataset.cat = c;
      bar.appendChild(chip);
    });
  }

  /* 单条食材行 */
  function ingredientRow(i) {
    var expInfo = expireState(i.expire);
    var card = el('div', 'card card--row');
    card.innerHTML =
      '<div class="card__main">' +
        '<div class="card__title">' + esc(i.name) + '</div>' +
        '<div class="card__meta">' + i.count + ' ' + esc(i.unit) + ' · ' + esc(i.location || '—') +
          ' · <span class="' + expInfo.cls + '">' + expInfo.text + '</span></div>' +
      '</div>' +
      '<div class="card__actions">' +
        '<button class="btn btn--sm" data-act="edit" data-id="' + i.id + '">编辑</button>' +
        '<button class="btn btn--sm btn--ghost" data-act="del" data-id="' + i.id + '">删除</button>' +
      '</div>';
    return card;
  }

  function renderFridge() {
    var d = Store.get();
    if (!$('#fridgeFilters').children.length) buildFridgeFilters();

    var q = ($('#fridgeSearch').value || '').trim();
    var items = d.ingredients.filter(function (i) {
      if (q && i.name.indexOf(q) < 0) return false;
      if (fridgeCat !== '全部' && i.category !== fridgeCat) return false;
      return true;
    });

    var list = $('#fridgeList'); list.innerHTML = '';
    if (!items.length) {
      list.appendChild(el('div', 'empty', fridgeCat === '全部' ? '冰箱是空的，点"新增"添加食材吧～' : '这一类还没有食材～'));
      return;
    }

    // 选了具体分类则不再按分类分组（避免重复标题）
    if (fridgeCat !== '全部') {
      items.forEach(function (i) { list.appendChild(ingredientRow(i)); });
      return;
    }

    var groups = {};
    items.forEach(function (i) { (groups[i.category] = groups[i.category] || []).push(i); });
    var cats = CATEGORIES.filter(function (c) { return groups[c] && groups[c].length; });
    cats.forEach(function (cat) {
      list.appendChild(el('div', 'group-title', cat));
      groups[cat].forEach(function (i) { list.appendChild(ingredientRow(i)); });
    });
  }

  function expireState(expire) {
    if (!expire) return { text: '无保质期', cls: '' };
    var days = Math.ceil((new Date(expire) - new Date(Store.today())) / 86400000);
    if (days < 0) return { text: '已过期', cls: 'exp exp--bad' };
    if (days <= 2) return { text: '剩 ' + days + ' 天', cls: 'exp exp--warn' };
    return { text: '剩 ' + days + ' 天', cls: 'exp' };
  }

  function ingredientForm(item) {
    item = item || {};
    var name = input({ value: item.name || '', placeholder: '食材名称' });
    var category = select(CATEGORIES, item.category || '蔬菜');
    var count = input({ type: 'number', value: item.count != null ? item.count : 1, min: 0 });
    var unit = input({ value: item.unit || '个', placeholder: '单位' });
    var expire = input({ type: 'date', value: item.expire || '' });

    // 存放位置：多选框（冷冻 / 冷藏）
    var locBox = el('div', 'checks');
    ['冷冻', '冷藏'].forEach(function (opt) {
      var lab = el('label', 'check');
      var cb = el('input'); cb.type = 'checkbox'; cb.value = opt;
      if ((item.location || '').indexOf(opt) >= 0) cb.checked = true;
      lab.appendChild(cb); lab.appendChild(document.createTextNode(opt));
      locBox.appendChild(lab);
    });

    // 点击数量 / 单位时自动置空，方便重新输入
    count.onfocus = function () { count.value = ''; };
    unit.onfocus = function () { unit.value = ''; };

    var box = el('div');
    [field('名称', name), field('分类', category), field('数量', count),
     field('单位', unit), field('存放位置', locBox), field('保质期（可不填）', expire)].forEach(function (f) { box.appendChild(f); });

    var save = el('button', 'btn btn--primary btn--block', '保存');
    save.onclick = function () {
      var locs = Array.prototype.slice.call(locBox.querySelectorAll('input:checked')).map(function (c) { return c.value; });
      var payload = {
        name: name.value.trim(), category: category.value,
        count: Number(count.value) || 0, unit: unit.value.trim() || '个',
        location: locs.join('+') || '冷藏', expire: expire.value || ''
      };
      if (!payload.name) { toast('请填写名称'); return; }
      if (item.id) Store.updateIngredient(item.id, payload); else Store.addIngredient(payload);
      Store.persist(); closeModal(); renderFridge(); toast('已保存');
    };
    box.appendChild(save);
    return box;
  }

  /* =========================================================
   *  3. 食记页
   * ========================================================= */
  function renderDiary() {
    var d = Store.get();
    var container = $('#diaryList'); if (!container) return;
    container.innerHTML = '';

    if (!d.diary.length) {
      container.appendChild(el('div', 'mine-empty-row', '还没有食记～\n在点菜页选好菜后点"去下单"吧'));
      return;
    }

    d.diary.forEach(function (entry) {
      var card = el('div', 'diary-card');

      // 头部：日期 + 删除
      var head = el('div', 'diary-card__head');
      var dateObj = new Date(entry.date + 'T12:00:00');
      var weekDays = ['日','一','二','三','四','五','六'];
      var badge = el('div', 'diary-date-badge');
      badge.innerHTML = '<span class="diary-date-badge__day">' + dateObj.getDate() + '</span><span class="diary-date-badge__weekday">周' + weekDays[dateObj.getDay()] + '</span>';

      var info = el('div', 'diary-date-info');
      info.innerHTML = '<div class="diary-date-info__label">' + (entry.date === Store.today() ? '今天' : entry.date) + '</div>' +
        '<div class="diary-date-info__sub">共 ' + entry.dishes.length + ' 道菜</div>';

      var delBtn = el('span', 'diary-date-del', '删除');
      delBtn.dataset.did = entry.id;

      head.appendChild(badge); head.appendChild(info); head.appendChild(delBtn);
      card.appendChild(head);

      // 只显示菜名（不显示图片、不按分类）
      var names = entry.dishes.map(function (x) { return x.name; }).join('、');
      card.appendChild(el('div', 'diary-names', esc(names)));

      container.appendChild(card);
    });
  }

  /* =========================================================
   *  4. 厨房页（菜谱管理）
   * ========================================================= */
  function renderKitchen() {
    var d = Store.get();
    var q = ($('#recipeSearch').value || '').trim();
    var items = d.recipes.filter(function (r) {
      if (!q) return true;
      return r.name.indexOf(q) >= 0 || (r.tags || []).some(function (t) { return t.indexOf(q) >= 0; });
    });
    var grid = $('#recipeList'); grid.innerHTML = '';
    if (!items.length) { grid.appendChild(el('div', 'empty', '还没有菜谱，点"新增"添加第一道菜吧～')); return; }

    items.forEach(function (r) {
      var card = el('div', 'recipe-card');
      var cover = r.cover
        ? '<div class="recipe-card__cover" style="background-image:url(' + r.cover + ')"></div>'
        : '<div class="recipe-card__cover recipe-card__cover--ph">' + esc(r.name.slice(0, 1)) + '</div>';
      card.innerHTML =
        cover +
        '<div class="recipe-card__body">' +
          '<div class="recipe-card__name">' + esc(r.name) + '</div>' +
          '<div class="tags">' + (r.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>' +
          '<div class="recipe-card__acts">' +
            '<button class="btn btn--sm btn--ghost" data-act="view" data-id="' + r.id + '">查看</button>' +
            '<button class="btn btn--sm btn--ghost" data-act="edit" data-id="' + r.id + '">编辑</button>' +
            '<button class="btn btn--sm btn--ghost" data-act="del" data-id="' + r.id + '">删除</button>' +
          '</div>' +
        '</div>';
      grid.appendChild(card);
    });
  }

  function recipeDetail(r) {
    var box = el('div');
    if (r.cover) box.appendChild(el('img', 'detail-cover')).src = r.cover;
    box.appendChild(el('h3', '', esc(r.name)));
    if ((r.tags || []).length) box.appendChild(el('p', 'hint', (r.tags || []).join(' / ')));
    box.appendChild(el('div', 'sub-title', '所需食材'));
    var ul = el('ul', 'shop-list');
    (r.ingredients || []).forEach(function (i) {
      var li = el('li'); li.innerHTML = '<span>' + esc(i.name) + '</span><b>' + (i.amount || '?') + ' ' + esc(i.unit || '') + '</b>';
      ul.appendChild(li);
    });
    box.appendChild(ul);
    box.appendChild(el('div', 'sub-title', '做法'));
    var ol = el('ol', 'steps');
    (r.steps || []).forEach(function (s) {
      var li = el('li'); li.innerHTML = esc(s.text) + (s.image ? '<img class="step-img" src="' + s.image + '">' : '');
      ol.appendChild(li);
    });
    box.appendChild(ol);
    return box;
  }

  function recipeForm(r) {
    r = r || {};
    var name = input({ value: r.name || '', placeholder: '菜名' });
    var tags = input({ value: (r.tags || []).join('、'), placeholder: '标签（如 荤菜、汤类，用、分隔）' });

    var coverInput = input({ type: 'file', accept: 'image/*' });
    var coverPreview = el('div', 'cover-preview');
    if (r.cover) { var im = el('img'); im.src = r.cover; coverPreview.appendChild(im); }
    var coverData = r.cover || '';
    coverInput.onchange = function () {
      var f = coverInput.files[0]; if (!f) return;
      compressImage(f, 480, function (dataUrl) {
        coverData = dataUrl; coverPreview.innerHTML = ''; var im = el('img'); im.src = dataUrl; coverPreview.appendChild(im);
      });
    };

    var ingBox = el('div', 'dyn');
    function addIngRow(ing) {
      ing = ing || {};
      var row = el('div', 'dyn-row');
      var n = input({ value: ing.name || '', placeholder: '食材' });
      var a = input({ value: ing.amount || '', placeholder: '用量', type: 'number' });
      var u = input({ value: ing.unit || '', placeholder: '单位' });
      var del = el('button', 'btn btn--sm btn--ghost', '✕');
      del.onclick = function () { row.remove(); };
      [n, a, u, del].forEach(function (x) { row.appendChild(x); });
      ingBox.appendChild(row);
    }
    (r.ingredients || []).forEach(addIngRow);

    var stepBox = el('div', 'dyn');
    function addStepRow(s) {
      s = s || {};
      var row = el('div', 'dyn-row dyn-row--col');
      var t = input({ value: s.text || '', placeholder: '步骤描述' });
      var del = el('button', 'btn btn--sm btn--ghost', '✕');
      del.onclick = function () { row.remove(); };
      row.appendChild(t); row.appendChild(del);
      stepBox.appendChild(row);
    }
    (r.steps || []).forEach(addStepRow);

    var box = el('div');
    box.appendChild(field('菜名', name));
    box.appendChild(field('标签', tags));
    box.appendChild(field('封面图', coverInput));
    box.appendChild(coverPreview);
    box.appendChild(el('div', 'sub-title', '所需食材 <button class="btn btn--sm" id="addIng">＋</button>'));
    box.appendChild(ingBox);
    box.appendChild(el('div', 'sub-title', '做法步骤 <button class="btn btn--sm" id="addStep">＋</button>'));
    box.appendChild(stepBox);

    var save = el('button', 'btn btn--primary btn--block', '保存');
    save.onclick = function () {
      var ings = $$('.dyn-row', ingBox).map(function (row) {
        var ins = row.querySelectorAll('input');
        return { name: ins[0].value.trim(), amount: Number(ins[1].value) || 0, unit: ins[2].value.trim() };
      }).filter(function (x) { return x.name; });
      var steps = $$('.dyn-row', stepBox).map(function (row) {
        return { text: row.querySelector('input').value.trim(), image: '' };
      }).filter(function (x) { return x.text; });
      var payload = {
        name: name.value.trim(),
        tags: tags.value.split('、').map(function (s) { return s.trim(); }).filter(Boolean),
        cover: coverData, ingredients: ings, steps: steps
      };
      if (!payload.name) { toast('请填写菜名'); return; }
      if (r.id) Store.updateRecipe(r.id, payload); else Store.addRecipe(payload);
      Store.persist(); closeModal(); renderKitchen(); toast('已保存');
    };

    setTimeout(function () {
      var ai = $('#addIng'); if (ai) ai.onclick = function () { addIngRow(); };
      var as = $('#addStep'); if (as) as.onclick = function () { addStepRow(); };
    }, 0);
    return box;
  }

  /* =========================================================
   *  5. 我的
   * ========================================================= */
  function renderMine() {
    var d = Store.get();
    $('#familyName').value = d.family.name || '';
    var list = $('#memberList'); list.innerHTML = '';
    if (!d.members.length) {
      list.appendChild(el('div', 'mine-empty-row', '还没有成员，点右上角"＋ 添加"'));
      return;
    }
    d.members.forEach(function (m) {
      var row = el('div', 'mine-row');
      row.innerHTML =
        '<span class="mine-row__icon">' + (m.avatar || '🙂') + '</span>' +
        '<span class="mine-row__main">' +
          '<span class="mine-row__name">' + esc(m.name) + '</span>' +
          '<span class="mine-row__sub">' + esc(m.role) + '</span>' +
        '</span>' +
        '<button class="btn btn--sm btn--ghost" data-act="del" data-id="' + m.id + '">移除</button>';
      list.appendChild(row);
    });
  }

  function memberForm() {
    var name = input({ placeholder: '成员昵称' });
    var avatar = input({ value: '🙂', placeholder: '头像 emoji' });
    var role = select(['管理员', '成员'], '成员');
    var box = el('div');
    [field('昵称', name), field('头像', avatar), field('角色', role)].forEach(function (f) { box.appendChild(f); });
    var save = el('button', 'btn btn--primary btn--block', '添加');
    save.onclick = function () {
      if (!name.value.trim()) { toast('请填写昵称'); return; }
      Store.addMember({ name: name.value.trim(), avatar: avatar.value.trim() || '🙂', role: role.value });
      Store.persist(); closeModal(); renderMine(); toast('已添加');
    };
    box.appendChild(save);
    return box;
  }

  /* =========================================================
   *  工具：图片压缩
   * ========================================================= */
  function compressImage(file, maxW, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, maxW / img.width);
        var c = document.createElement('canvas');
        c.width = img.width * scale; c.height = img.height * scale;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.7));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  /* =========================================================
   *  事件绑定
   * ========================================================= */
  function bind() {
    // 底部导航
    $$('.tab').forEach(function (b) { b.onclick = function () { switchTab(b.dataset.tab); }; });

    // 弹窗关闭
    $$('[data-close]').forEach(function (x) { x.onclick = closeModal; });

    // 今日菜单面板
    $('#btnTodayMenu').onclick = openTodaySheet;
    $('#sheetMask').onclick = closeTodaySheet;
    $('#sheetClose').onclick = closeTodaySheet;
    $('#btnPlaceOrder').onclick = saveToDiary;

    // 采购清单
    $('#btnShopping').onclick = generateShoppingList;

    // 点菜分类筛选
    $('#orderFilters').addEventListener('click', function (e) {
      var btn = e.target.closest('.ofilter'); if (!btn) return;
      $$('#orderFilters .ofilter').forEach(function (x) { x.classList.remove('ofilter--active'); });
      btn.classList.add('ofilter--active');
      orderCat = btn.dataset.cat; renderOrder();
    });

    // 冰箱
    $('#btnAddIngredient').onclick = function () { openModal('新增食材', ingredientForm()); };
    $('#fridgeSearch').oninput = renderFridge;
    $('#fridgeFilters').addEventListener('click', function (e) {
      var chip = e.target.closest('.chip'); if (!chip) return;
      $$('#fridgeFilters .chip').forEach(function (x) { x.classList.remove('chip--active'); });
      chip.classList.add('chip--active');
      fridgeCat = chip.dataset.cat; renderFridge();
    });

    // 厨房（菜谱管理）
    $('#btnAddRecipe').onclick = function () { openModal('新增菜谱', recipeForm()); };
    $('#recipeSearch').oninput = renderKitchen;
    $('#btnBackFromKitchen').onclick = function () { switchTab('mine'); };

    // 我的
    $('#btnSaveFamily').onclick = function () {
      Store.get().family.name = $('#familyName').value.trim() || '未命名';
      Store.persist(); $('#headerSub').textContent = '家庭：' + Store.get().family.name; toast('已保存');
    };
    $('#btnAddMember').onclick = function () { openModal('添加成员', memberForm()); };
    $('#btnSeed').onclick = function () { Store.reseed(); switchTab(currentTab); toast('已载入示例'); };
    $('#btnReset').onclick = function () {
      if (confirm('确定清空所有数据？')) { Store.reset(); switchTab(currentTab); toast('已清空'); }
    };

    // 厨房入口等子页面跳转（data-goto）
    $('#screen').addEventListener('click', function (e) {
      var goto = e.target.closest('[data-goto]');
      if (goto) { goToSubPage(goto.dataset.goto); return; }

      var btn = e.target.closest('[data-act]'); if (!btn) return;
      var act = btn.dataset.act, id = btn.dataset.id;
      var d = Store.get();

      // 点菜页操作
      if (currentTab === 'order') {
        if (act === 'catalog-add') addToOrder(id);
        else if (act === 'catalog-view') {
          var rr = d.recipes.find(function (x) { return x.id === id; });
          if (rr) openModal(rr.name, recipeDetail(rr));
        }
      }

      // 冰箱操作
      if (currentTab === 'fridge') {
        if (act === 'edit') { var ing = d.ingredients.find(function (x) { return x.id === id; }); openModal('编辑食材', ingredientForm(ing)); }
        if (act === 'del') { Store.removeIngredient(id); Store.persist(); renderFridge(); }
      }

      // 厨房页操作
      if (currentTab === 'kitchen') {
        var r = d.recipes.find(function (x) { return x.id === id; });
        if (act === 'view') { openModal(r.name, recipeDetail(r)); }
        else if (act === 'edit') { openModal('编辑菜谱', recipeForm(r)); }
        else if (act === 'del') { if (confirm('删除该菜谱？')) { Store.removeRecipe(id); Store.persist(); renderKitchen(); } }
      }

      // 我的-成员
      if (currentTab === 'mine' && act === 'del') { Store.removeMember(id); Store.persist(); renderMine(); }
    });

    // 食记页删除
    $('#diaryList').addEventListener('click', function (e) {
      var del = e.target.closest('.diary-date-del'); if (!del) return;
      if (confirm('删除这条食记？')) {
        Store.removeDiary(del.dataset.did);
        Store.persist(); renderDiary();
        toast('已删除');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    bind();
    switchTab('order');
  });
})();

</script>
</body>
